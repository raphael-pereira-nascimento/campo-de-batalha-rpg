<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1028;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d1b4e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd166;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5fbf;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Fundo arredondado -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  <!-- Borda interna -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="#ffd166" stroke-width="6" opacity="0.6" />
  <!-- Espada cruzada com varinha mágica -->
  <g filter="url(#glow)">
    <!-- Espada principal (diagonal) -->
    <path d="M 150 362 L 256 200 L 362 362 Z" fill="url(#blade)" />
    <path d="M 190 330 L 256 240 L 322 330 Z" fill="#ffe082" />
    <!-- Hilt / empunhadura -->
    <rect x="244" y="200" width="24" height="40" rx="6" fill="#4a3a5e" />
    <rect x="236" y="192" width="40" height="10" rx="4" fill="#ffd166" />
    <!-- Varinha mágica cruzada -->
    <path d="M 362 150 L 256 256 L 150 362 Z" fill="none" stroke="#8b5fbf" stroke-width="14" stroke-linecap="round" />
    <circle cx="256" cy="256" r="18" fill="#ffd166" />
    <!-- Estrelas mágicas -->
    <path d="M 130 130 L 142 142 L 130 154 L 118 142 Z" fill="#ffd166" />
    <path d="M 382 382 L 394 394 L 382 406 L 370 394 Z" fill="#ffd166" />
    <path d="M 130 382 L 142 394 L 130 406 L 118 394 Z" fill="#8b5fbf" />
    <path d="M 382 130 L 394 142 L 382 154 L 370 142 Z" fill="#8b5fbf" />
  </g>
  <!-- Letra C discreta -->
  <text x="256" y="450" font-family="serif" font-size="64" font-weight="bold" fill="#ffd166" text-anchor="middle" opacity="0.9">C</text>
</svg>
