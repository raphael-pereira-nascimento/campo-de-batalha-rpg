<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1028;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d1b4e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd166;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5fbf;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <!-- Decoração borda -->
  <rect x="40" y="40" width="1120" height="550" rx="60" fill="none" stroke="#ffd166" stroke-width="8" opacity="0.4" />
  <!-- Espada central grande -->
  <g filter="url(#glow)">
    <path d="M 420 520 L 600 280 L 780 520 Z" fill="url(#blade)" />
    <path d="M 490 480 L 600 360 L 710 480 Z" fill="#ffe082" />
    <rect x="588" y="280" width="24" height="50" rx="6" fill="#4a3a5e" />
    <rect x="576" y="272" width="48" height="14" rx="6" fill="#ffd166" />
    <path d="M 780 180 L 600 400 L 420 520 Z" fill="none" stroke="#8b5fbf" stroke-width="24" stroke-linecap="round" />
    <circle cx="600" cy="400" r="40" fill="#ffd166" />
    <path d="M 300 300 L 320 320 L 300 340 L 280 320 Z" fill="#ffd166" />
    <path d="M 900 460 L 920 480 L 900 500 L 880 480 Z" fill="#ffd166" />
    <path d="M 300 460 L 320 480 L 300 500 L 280 480 Z" fill="#8b5fbf" />
    <path d="M 900 300 L 920 320 L 900 340 L 880 320 Z" fill="#8b5fbf" />
  </g>
  <!-- Título -->
  <text x="600" y="380" font-family="'Georgia', serif" font-size="72" font-weight="bold" fill="#ffd166" text-anchor="middle">Campo de Batalha RPG</text>
  <text x="600" y="440" font-family="'Georgia', serif" font-size="34" fill="#8b5fbf" text-anchor="middle">Sistema de Batalhas de RPG em Tempo Real</text>
  <text x="600" y="560" font-family="sans-serif" font-size="26" fill="#b8a9cf" text-anchor="middle">raphael-pereira-nascimento.github.io/campo-de-batalha-rpg</text>
</svg>
